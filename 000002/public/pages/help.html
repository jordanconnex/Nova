<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Aide — Nova</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script type="module" src="../assets/js/main.js" defer></script>
</head>

<body class="app-page">
    <header class="app-header shell"><a class="brand" href="../index.html"><span class="brand-mark">N</span> nova</a>
        <nav><a href="create.html">Créer</a><a href="contact.html">Contact</a><a href="profile.html">Mon espace</a>
        </nav><a class="button button-dark" href="create.html">Créer un site ↗</a>
    </header>
    <main class="shell help-page">
        <div class="help-hero"><span class="eyebrow"><i></i> Centre d'aide</span>
            <h1>On avance<br><em>ensemble.</em></h1>
            <p>Des réponses simples aux questions qui reviennent le plus souvent.</p>
            <div class="search-box help-search"><span>⌕</span><input type="search" placeholder="Rechercher une réponse">
            </div>
        </div>
        <div class="help-grid">
            <section>
                <h2>Questions fréquentes</h2>
                <div class="faq-list"><button class="faq" data-faq><span>Comment publier mon site ?</span><b>+</b>
                        <p>Depuis l'éditeur, cliquez sur Publier. Vous pourrez choisir un sous-domaine Nova ou connecter
                            votre propre domaine.</p>
                    </button><button class="faq" data-faq><span>Puis-je changer de modèle ?</span><b>+</b>
                        <p>Oui. Vos contenus restent séparés du design, vous pouvez donc explorer d'autres modèles à
                            tout moment.</p>
                    </button><button class="faq" data-faq id="password"><span>J'ai oublié mon mot de
                            passe.</span><b>+</b>
                        <p>Demandez un lien de réinitialisation depuis la page de connexion. Il arrive généralement en
                            moins d'une minute.</p>
                    </button><button class="faq" data-faq><span>Comment inviter un collaborateur ?</span><b>+</b>
                        <p>Ouvrez votre espace puis utilisez le bouton Inviter un collaborateur sur le projet concerné.
                        </p>
                    </button></div>
            </section>
            <aside class="help-contact surface"><span class="module-icon icon-spark">✦</span>
                <h3>Vous ne trouvez pas ?</h3>
                <p>Notre équipe est là pour vous répondre avec un vrai message, pas un robot.</p><a
                    class="button button-dark" href="contact.html">Nous contacter ↗</a>
            </aside>
        </div>
    </main>
    <div class="toast" id="toast"></div>
</body>

</html>
